<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AliAsaf-Scooter Logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#1b4434"/><stop offset="1" stop-color="#0b1a14"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#ffd9b8"/><stop offset=".75" stop-color="#f2b48a"/><stop offset="1" stop-color="#e09a70"/>
    </radialGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2ff8f"/><stop offset=".55" stop-color="#c8ff57"/><stop offset="1" stop-color="#8fd23a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3226"/><stop offset="1" stop-color="#2b1b14"/>
    </linearGradient>
  </defs>
  <!-- background disc with neon ring, like the previous icon -->
  <rect width="512" height="512" fill="#0b1a14"/>
  <circle cx="256" cy="256" r="238" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#2c5a46" stroke-width="6"/>
  <!-- speed lines -->
  <g stroke-linecap="round">
    <line x1="38" y1="300" x2="96" y2="300" stroke="#63d48a" stroke-width="10"/>
    <line x1="50" y1="330" x2="92" y2="330" stroke="#3f7a5c" stroke-width="8"/>
    <line x1="416" y1="300" x2="474" y2="300" stroke="#63d48a" stroke-width="10"/>
    <line x1="420" y1="330" x2="462" y2="330" stroke="#3f7a5c" stroke-width="8"/>
  </g>
  <!-- ears -->
  <ellipse cx="128" cy="292" rx="30" ry="38" fill="#eba57c"/>
  <ellipse cx="384" cy="292" rx="30" ry="38" fill="#eba57c"/>
  <ellipse cx="132" cy="294" rx="13" ry="19" fill="#d98a63"/>
  <ellipse cx="380" cy="294" rx="13" ry="19" fill="#d98a63"/>
  <!-- face -->
  <ellipse cx="256" cy="292" rx="128" ry="132" fill="url(#skin)"/>
  <!-- hair fringe peeking out under the helmet -->
  <path d="M146 232 Q170 266 204 246 Q226 274 256 250 Q286 274 310 246 Q342 266 366 232 L366 214 L146 214 Z" fill="url(#hair)"/>
  <!-- helmet -->
  <path d="M118 236 Q118 96 256 92 Q394 96 394 236 Q256 214 118 236 Z" fill="url(#helmet)" stroke="#16341f" stroke-width="8" stroke-linejoin="round"/>
  <path d="M164 150 Q206 112 262 110" fill="none" stroke="#f6ffd6" stroke-width="14" stroke-linecap="round" opacity=".75"/>
  <path d="M256 94 L256 222" stroke="#16341f" stroke-width="7" opacity=".35"/>
  <rect x="226" y="132" width="60" height="16" rx="8" fill="#16341f" opacity=".55"/>
  <!-- eyebrows -->
  <path d="M180 262 Q204 248 226 260" fill="none" stroke="#3a261c" stroke-width="9" stroke-linecap="round"/>
  <path d="M286 260 Q308 248 332 262" fill="none" stroke="#3a261c" stroke-width="9" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="204" cy="300" rx="25" ry="30" fill="#ffffff"/>
  <ellipse cx="308" cy="300" rx="25" ry="30" fill="#ffffff"/>
  <circle cx="208" cy="304" r="17" fill="#3d2a1f"/>
  <circle cx="312" cy="304" r="17" fill="#3d2a1f"/>
  <circle cx="208" cy="304" r="9" fill="#120b07"/>
  <circle cx="312" cy="304" r="9" fill="#120b07"/>
  <circle cx="215" cy="295" r="6.5" fill="#ffffff"/>
  <circle cx="319" cy="295" r="6.5" fill="#ffffff"/>
  <circle cx="202" cy="312" r="3" fill="#ffffff" opacity=".8"/>
  <circle cx="306" cy="312" r="3" fill="#ffffff" opacity=".8"/>
  <!-- cheeks and freckles -->
  <ellipse cx="170" cy="350" rx="26" ry="16" fill="#ff8a7a" opacity=".45"/>
  <ellipse cx="342" cy="350" rx="26" ry="16" fill="#ff8a7a" opacity=".45"/>
  <g fill="#c97a52" opacity=".7">
    <circle cx="160" cy="340" r="3"/><circle cx="174" cy="346" r="3"/><circle cx="164" cy="355" r="3"/>
    <circle cx="352" cy="340" r="3"/><circle cx="338" cy="346" r="3"/><circle cx="348" cy="355" r="3"/>
  </g>
  <!-- nose -->
  <path d="M248 328 Q256 340 266 330" fill="none" stroke="#c9825c" stroke-width="7" stroke-linecap="round"/>
  <!-- big happy open smile -->
  <path d="M200 362 Q256 430 312 362 Q256 378 200 362 Z" fill="#7a2a2a" stroke="#5a1d1d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M212 366 Q256 378 300 366 L298 376 Q256 386 214 376 Z" fill="#ffffff"/>
  <path d="M228 398 Q256 414 284 398 Q270 388 256 390 Q242 388 228 398 Z" fill="#ff7b7b"/>
  <!-- helmet chin strap -->
  <path d="M136 250 Q150 340 206 392" fill="none" stroke="#16341f" stroke-width="7" stroke-linecap="round" opacity=".6"/>
  <path d="M376 250 Q362 340 306 392" fill="none" stroke="#16341f" stroke-width="7" stroke-linecap="round" opacity=".6"/>
</svg>
